name: Rebuild committed plugin bundle

on:
  push:
    branches:
      - main
    paths:
      - src/session.ts

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, and build
        run: npm run check

      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet -- lib; then
            echo "Generated bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib
          git commit -m "build: refresh bundle after image budget fix"
          git push origin HEAD:main
